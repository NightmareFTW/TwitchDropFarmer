name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows bundle
        shell: pwsh
        run: .\build_exe.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchDropFarmer-win64
          path: dist/TwitchDropFarmer-win64.zip

      - name: Pick the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # docs/releases/<tag>.md is the release text; without it GitHub generates one.
          $file = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $file) { "path=$file" >> $env:GITHUB_OUTPUT } else { "path=" >> $env:GITHUB_OUTPUT }

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TwitchDropFarmer-win64.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
